<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dryer Catch · Culture Apparel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<!-- Seasonal / holiday theme: the production dashboard's own script + photos (seasons/). -->
<script src="/seasonal.js" defer></script>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo">
    <svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><g fill="#E0312B"><rect x="12" y="9" width="24" height="3.1" rx="1.5"/><rect x="8" y="14" width="32" height="3.1" rx="1.5"/><rect x="5" y="19" width="38" height="3.1" rx="1.5"/><rect x="5" y="24" width="38" height="3.1" rx="1.5"/><rect x="6" y="29" width="36" height="3.1" rx="1.5"/><rect x="9" y="34" width="30" height="3.1" rx="1.5"/><rect x="13" y="39" width="22" height="3.1" rx="1.5"/></g></svg>
    <div><div class="logo-1">CULTURE</div><div class="logo-2">APPAREL</div></div>
  </div>
  <div class="hdr-title">DRYER CATCH</div>
  <div class="ca-hdr-tag" aria-hidden="true">QUALITY MERCH. REAL IMPACT.</div>
  <div class="hdr-right">
    <div class="hdr-clock"><div id="clock">--:--</div><div class="conn"><span id="conn-dot"></span><span id="conn-label">Connecting</span></div></div>
    <div class="zoom" role="group" aria-label="Screen size">
      <button id="zoom-out" aria-label="Make everything smaller"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M8 10.5h5M15.5 15.5 20 20"/></svg></button>
      <button id="zoom-reset" aria-label="Reset screen size">100%</button>
      <button id="zoom-in" aria-label="Make everything bigger"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M8 10.5h5M10.5 8v5M15.5 15.5 20 20"/></svg></button>
    </div>
    <button id="who" class="who" hidden aria-label="Switch catcher"><span id="who-init" class="who-init"></span><span id="who-name" class="who-name"></span><span id="who-left" class="who-left" aria-label="Time left before signing out"></span></button>
  </div>
</header>
<div id="app" class="app" aria-live="polite"></div>
<div id="overlay"></div>
<div id="toast"></div>
<noscript><p style="color:#fff;padding:20px">This app needs JavaScript turned on.</p></noscript>
<script src="/app.js"></script>
</body>
</html>
