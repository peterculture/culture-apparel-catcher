<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212322">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Catch">
<meta name="application-name" content="The Catch">
<title>The Catch · Noble Made</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noble Made type, as The Forge (2026-11-23): 'Oswald' / 'Archivo' in app.css are Barlow, via nm.css. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<!-- Light / dark (Noble Made, matched to The Forge, 2026-11-23): theme.js before first paint, then the colours. -->
<script src="/theme.js"></script>
<link rel="stylesheet" href="/palette.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/nm.css">
<!-- Seasonal / holiday theme: the production dashboard's own script + photos (seasons/). -->
<script src="/seasonal.js" defer></script>
</head>
<body>
<header class="hdr">
  <!-- Noble Made lockup, as The Forge's header: monogram, wordmark, "by Noble Made" (2026-11-23). -->
  <div class="hdr-logo" role="img" aria-label="The Catch by Noble Made">
    <span class="nm-mark" aria-hidden="true"></span>
    <div class="nm-lockup" aria-hidden="true"><span class="nm-catch-wrap"><span class="nm-catch"></span></span><div class="nm-by">by <span class="nm-wordmark"></span></div></div>
  </div>
  <div class="ca-hdr-tag" aria-hidden="true">CUSTOM APPAREL · FRANKLIN, TN</div>
  <div class="hdr-right">
    <button type="button" data-ca-theme-toggle class="ca-theme-btn" title="Switch between light and dark (this tablet only)" aria-label="Switch between light and dark"><span class="ca-theme-opt ca-theme-opt--light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></span><span class="ca-theme-opt ca-theme-opt--dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span>Dark</span></span></button>
    <div class="hdr-clock"><div id="clock">--:--</div><div class="conn"><span id="conn-dot"></span><span id="conn-label">Connecting</span></div></div>
    <button id="help-btn" class="help-btn" hidden aria-label="Help: found a bug? Report it" aria-haspopup="dialog" title="Found a bug? Report it here"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4.9c0 1.9-2.7 2.5-2.7 4.2"/><path d="M12 17.4v.01"/></svg></button>
    <div class="zoom" role="group" aria-label="Screen size">
      <button id="zoom-out" aria-label="Make everything smaller"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M8 10.5h5M15.5 15.5 20 20"/></svg></button>
      <button id="zoom-reset" aria-label="Reset screen size">100%</button>
      <button id="zoom-in" aria-label="Make everything bigger"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M8 10.5h5M10.5 8v5M15.5 15.5 20 20"/></svg></button>
    </div>
    <button id="who" class="who" hidden aria-label="Switch catcher"><span id="who-init" class="who-init"></span><span id="who-name" class="who-name"></span><span id="who-left" class="who-left" aria-label="Time left before signing out"></span></button>
  </div>
</header>
<div id="app" class="app" aria-live="polite"></div>
<div id="overlay"></div>
<div id="help"></div>
<div id="toast"></div>
<noscript><p style="color:#fff;padding:20px">This app needs JavaScript turned on.</p></noscript>
<script src="/app.js"></script>
<!-- 3D buttons, copied from The Forge (11-02). Purely visual: the app works the same without it. -->
<script src="/buttons-3d.js" defer></script>
</body>
</html>
